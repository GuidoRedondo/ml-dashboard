<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ventas por Hora — Negocio Redondo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --font:   'Poppins', sans-serif;
    --font-b: 'Poppins', sans-serif;

    --bg:          #F5F6FA;
    --surface:     #FFFFFF;
    --surface2:    #F0F2F8;
    --border:      #E4E7F0;
    --text:        #1A1D2E;
    --muted:       #8B90A7;
    --accent:      #FFD600;
    --accent-text: #1A1D2E;
    --green:       #00C851;
    --red:         #FF4444;
    --orange:      #FF8800;
    --blue:        #3B82F6;
    --shadow:      0 2px 12px rgba(0,0,0,0.07);
    --shadow-lg:   0 8px 32px rgba(0,0,0,0.10);

    /* colores semánticos del canal — no modificar */
    --flex:   #00b37a;
    --coleta: #e07020;
    --me2:    #3B82F6;
    --full:   #9333ea;
    --corte:  #FF4444;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    padding: 28px 24px 48px;
  }

  /* ── HEADER ── */
  header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 12px;
  }

  h1 {
    font-family: var(--font-b);
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.1;
  }
  h1 span { color: var(--flex); }

  .subtitle {
    font-size: 11px;
    color: var(--muted);
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-top: 4px;
  }

  /* ── DAY BUTTONS ── */
  .controls { display: flex; gap: 6px; flex-wrap: wrap; }

  .day-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: var(--font);
    font-size: 12px;
    font-weight: 600;
    padding: 6px 14px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .day-btn:hover { background: var(--surface2); border-color: #C5CAE0; color: var(--text); }
  .day-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-text);
    font-weight: 700;
  }

  /* ── CORTE STRIP ── */
  .corte-strip {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 20px;
    margin-bottom: 20px;
    display: flex;
    gap: 28px;
    flex-wrap: wrap;
    align-items: center;
    box-shadow: var(--shadow);
  }

  .corte-strip label {
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .corte-strip input[type="time"] {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--font);
    font-size: 13px;
    font-weight: 500;
    padding: 5px 10px;
    border-radius: 8px;
    cursor: pointer;
    outline: none;
    transition: border-color 0.15s;
  }
  .corte-strip input[type="time"]:focus { border-color: var(--accent); }

  /* ── CARD GRID ── */
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
  }
  @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 18px 12px;
    box-shadow: var(--shadow);
    position: relative;
    overflow: hidden;
    transition: box-shadow 0.2s;
  }
  .card:hover { box-shadow: var(--shadow-lg); }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    border-radius: 14px 14px 0 0;
  }
  .card[data-ch="flex"]::before   { background: var(--flex); }
  .card[data-ch="coleta"]::before { background: var(--coleta); }
  .card[data-ch="me2"]::before    { background: var(--me2); }
  .card[data-ch="full"]::before   { background: var(--full); }

  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }

  .card-title {
    font-family: var(--font-b);
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .card-dot {
    width: 9px; height: 9px;
    border-radius: 3px;
    flex-shrink: 0;
  }

  .card-total {
    font-size: 11px;
    color: var(--muted);
    font-weight: 500;
  }
  .card-total strong {
    font-family: var(--font-b);
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    margin-right: 2px;
  }

  canvas { display: block; width: 100% !important; }

  /* ── CORTE ALERT ── */
  .corte-alert {
    margin-top: 16px;
    background: rgba(255,68,68,0.07);
    border: 1px solid rgba(255,68,68,0.25);
    border-radius: 10px;
    padding: 12px 18px;
    font-size: 13px;
    font-weight: 600;
    color: var(--red);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .corte-alert.hidden { display: none; }

  /* ── TOOLTIP ── */
  #tooltip {
    position: fixed;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 12px;
    font-family: var(--font);
    pointer-events: none;
    display: none;
    z-index: 100;
    min-width: 140px;
    box-shadow: var(--shadow-lg);
  }
  #tooltip .tt-hour {
    font-family: var(--font-b);
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 6px;
  }
  #tooltip .tt-val { color: var(--muted); font-size: 12px; }
  #tooltip .tt-val strong { color: var(--text); font-weight: 700; }
</style>
</head>
<body>

<header>
  <div>
    <h1>Ventas por <span>hora</span></h1>
    <div class="subtitle">Canal de envío · Corte same day</div>
  </div>
  <div class="controls" id="dayBtns"></div>
</header>

<div class="corte-strip">
  <label>Corte Flex <input type="time" id="corteFlex" value="14:00" /></label>
  <label>Corte Coleta <input type="time" id="corteColeta" value="15:30" /></label>
</div>

<div class="grid" id="grid"></div>
<div class="corte-alert hidden" id="corteAlert">⚠ Faltan menos de 60 min para el corte Flex</div>
<div id="tooltip"></div>

<script>
const CHANNELS = [
  { key: 'flex',   label: 'Flex',   color: '#00b37a', corteId: 'corteFlex' },
  { key: 'coleta', label: 'Coleta', color: '#e07020', corteId: 'corteColeta' },
  { key: 'me2',    label: 'ME2',    color: '#3B82F6', corteId: null },
  { key: 'full',   label: 'Full',   color: '#9333ea', corteId: null },
];
const HOURS = Array.from({length: 18}, (_, i) => i + 7);
const DAYS  = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'];

function generateDay() {
  const p1 = [9,10,11,12], p2 = [15,16,17,18];
  return HOURS.map(h => {
    const b = (p1.includes(h) || p2.includes(h)) ? 9 : 2;
    return { flex: Math.floor(Math.random()*(b+5)), coleta: Math.floor(Math.random()*(b+3)), me2: Math.floor(Math.random()*(b+7)), full: Math.floor(Math.random()*(b+4)) };
  });
}
const allData = DAYS.map(() => generateDay());
let activeDay = 4;
const canvases = {};
const tooltip = document.getElementById('tooltip');

// Day buttons
const dayContainer = document.getElementById('dayBtns');
DAYS.forEach((d, i) => {
  const btn = document.createElement('button');
  btn.className = 'day-btn' + (i === activeDay ? ' active' : '');
  btn.textContent = d;
  btn.onclick = () => { activeDay = i; updateAll(); };
  dayContainer.appendChild(btn);
});

// Build cards
const grid = document.getElementById('grid');
CHANNELS.forEach(ch => {
  const card = document.createElement('div');
  card.className = 'card';
  card.setAttribute('data-ch', ch.key);
  card.innerHTML = `
    <div class="card-header">
      <div class="card-title"><div class="card-dot" style="background:${ch.color}"></div>${ch.label}</div>
      <div class="card-total" id="total-${ch.key}"></div>
    </div>
    <canvas id="canvas-${ch.key}" height="140"></canvas>
  `;
  grid.appendChild(card);
  const canvas = card.querySelector('canvas');
  canvases[ch.key] = canvas;
  attachTooltip(canvas, ch);
});

function getCorteH(id) {
  if (!id) return null;
  const [h, m] = document.getElementById(id).value.split(':').map(Number);
  return h + m / 60;
}

function drawChannel(ch) {
  const canvas = canvases[ch.key];
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.parentElement.getBoundingClientRect();
  const W = rect.width - 36;
  const H = 140;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  const c = canvas.getContext('2d');
  c.scale(dpr, dpr);
  c.clearRect(0, 0, W, H);

  const data = allData[activeDay].map(r => r[ch.key]);
  const maxVal = Math.max(...data, 1);
  const total = data.reduce((a,b) => a+b, 0);
  document.getElementById('total-' + ch.key).innerHTML = `<strong>${total}</strong> pedidos`;

  const padL=30, padR=10, padT=10, padB=22;
  const chartW = W - padL - padR;
  const chartH = H - padT - padB;
  const barW = chartW / HOURS.length;

  // Grid lines
  [0, 0.25, 0.5, 0.75, 1].forEach(frac => {
    const y = padT + chartH - chartH * frac;
    c.beginPath();
    c.strokeStyle = frac === 0 ? '#E4E7F0' : '#F0F2F8';
    c.lineWidth = 1;
    c.moveTo(padL, y); c.lineTo(padL + chartW, y); c.stroke();
    if (frac > 0) {
      c.fillStyle = '#8B90A7';
      c.font = '9px Poppins, sans-serif';
      c.textAlign = 'right';
      c.fillText(Math.round(maxVal * frac), padL - 4, y + 3);
    }
  });

  // Bars
  data.forEach((val, i) => {
    const x = padL + i * barW + 2;
    const bw = barW - 4;
    const bh = (val / maxVal) * chartH;
    const y = padT + chartH - bh;
    const grad = c.createLinearGradient(0, y, 0, y + bh);
    grad.addColorStop(0, ch.color + 'cc');
    grad.addColorStop(1, ch.color + '22');
    c.fillStyle = grad;
    roundRect(c, x, y, bw, bh, 3); c.fill();
  });

  // Hour labels
  c.fillStyle = '#8B90A7';
  c.font = '9px Poppins, sans-serif';
  c.textAlign = 'center';
  HOURS.forEach((h, i) => {
    if (i % 3 !== 0) return;
    c.fillText(h + 'h', padL + i * barW + barW / 2, padT + chartH + 14);
  });

  // Corte line
  const corteH = getCorteH(ch.corteId);
  if (corteH !== null) {
    const minH = HOURS[0], maxH = HOURS[HOURS.length-1]+1;
    if (corteH >= minH && corteH <= maxH) {
      const frac = (corteH - minH) / (maxH - minH);
      const x = padL + frac * chartW;
      c.save();
      c.beginPath(); c.setLineDash([4,3]);
      c.strokeStyle = '#FF4444'; c.lineWidth = 1.5; c.globalAlpha = 0.85;
      c.moveTo(x, padT); c.lineTo(x, padT + chartH); c.stroke();
      c.setLineDash([]); c.globalAlpha = 1;
      c.fillStyle = '#FF4444';
      c.font = '600 9px Poppins, sans-serif';
      c.textAlign = frac > 0.75 ? 'right' : 'left';
      c.fillText('corte', x + (frac > 0.75 ? -4 : 4), padT + 10);
      c.restore();
    }
  }
}

function roundRect(ctx, x, y, w, h, r) {
  if (h <= 0 || w <= 0) return;
  r = Math.min(r, h/2, w/2);
  ctx.beginPath();
  ctx.moveTo(x+r, y); ctx.lineTo(x+w-r, y); ctx.quadraticCurveTo(x+w, y, x+w, y+r);
  ctx.lineTo(x+w, y+h); ctx.lineTo(x, y+h); ctx.lineTo(x, y+r); ctx.quadraticCurveTo(x, y, x+r, y);
  ctx.closePath();
}

function attachTooltip(canvas, ch) {
  canvas.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const chartW = rect.width - 40;
    const barW = chartW / HOURS.length;
    const idx = Math.floor((mx - 30) / barW);
    if (idx < 0 || idx >= HOURS.length) { tooltip.style.display = 'none'; return; }
    const val = allData[activeDay][idx][ch.key];
    tooltip.innerHTML = `<div class="tt-hour" style="color:${ch.color}">${ch.label} · ${HOURS[idx]}:00</div><div class="tt-val"><strong>${val}</strong> pedidos</div>`;
    tooltip.style.display = 'block';
    tooltip.style.left = (e.clientX + 12) + 'px';
    tooltip.style.top  = (e.clientY - 16) + 'px';
  });
  canvas.addEventListener('mouseleave', () => { tooltip.style.display = 'none'; });
}

function updateAll() {
  CHANNELS.forEach(drawChannel);
  document.querySelectorAll('.day-btn').forEach((b, i) => b.classList.toggle('active', i === activeDay));
  const now = new Date();
  const corteH = getCorteH('corteFlex');
  const nowH = now.getHours() + now.getMinutes()/60;
  document.getElementById('corteAlert').classList.toggle('hidden', !(corteH - nowH > 0 && corteH - nowH < 1));
}

document.getElementById('corteFlex').addEventListener('change', updateAll);
document.getElementById('corteColeta').addEventListener('change', updateAll);
window.addEventListener('resize', updateAll);
requestAnimationFrame(() => requestAnimationFrame(updateAll));
</script>
</body>
</html>
